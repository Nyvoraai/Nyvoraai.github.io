name: Submit URLs to Google Indexing API

on:
  workflow_dispatch:

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-auth requests

      - name: Write key file
        run: echo '${{ secrets.GCP_SA_KEY }}' > key.json

      - name: Submit URLs
        run: |
          python - <<'EOF'
          import json
          import sys
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession

          SCOPES = ["https://www.googleapis.com/auth/indexing"]
          credentials = service_account.Credentials.from_service_account_file("key.json", scopes=SCOPES)
          print(f"=== Service Account Email: {credentials.service_account_email} ===")
          session = AuthorizedSession(credentials)

          with open("urls.txt") as f:
              urls = [line.strip() for line in f if line.strip()]

          print(f"Found {len(urls)} URLs to submit.")
          success = 0
          failed = 0
          for i, url in enumerate(urls, 1):
              payload = {"url": url, "type": "URL_UPDATED"}
              r = session.post("https://indexing.googleapis.com/v3/urlNotifications:publish", data=json.dumps(payload))
              if r.status_code == 200:
                  success += 1
                  print(f"[{i}/{len(urls)}] 200 OK: {url}")
              else:
                  failed += 1
                  print(f"[{i}/{len(urls)}] {r.status_code} Error: {url}")
                  print(r.text)
                  if r.status_code == 403:
                      print(f"\n[ACTION REQUIRED] Please add the service account '{credentials.service_account_email}' as an Owner in Google Search Console for https://nyvoraai.tech/")
                      break

          print(f"\nSummary: {success} succeeded, {failed} failed.")
          EOF
